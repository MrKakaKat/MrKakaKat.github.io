name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'terminal/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor and copy web assets
        working-directory: app
        run: npm ci && npm run sync

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$HAS_KEYSTORE" = true ]; then task=assembleRelease; type=release; else task=assembleDebug; type=debug
            echo "::warning::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS are not set: building a debug APK, no release is published."
          fi
          ./gradlew --no-daemon testDebugUnitTest "$task" -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/$type/app-$type.apk "$RUNNER_TEMP/out/heatmap-$VERSION-$type.apk"
          echo "APK=$RUNNER_TEMP/out/heatmap-$VERSION-$type.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: heatmap-${{ env.VERSION }}
          path: ${{ env.APK }}

      - name: Publish GitHub release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$APK" --target "$GITHUB_SHA" --title "Heatmap $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
